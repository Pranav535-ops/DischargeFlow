services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dischargeflow
      POSTGRES_USER: dischargeflow
      POSTGRES_PASSWORD: dischargeflow  # local development only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dischargeflow -d dischargeflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dischargeflow-network

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.cli", "migrate"]  # alembic upgrade head + encrypt any plaintext PHI
    environment: &backend-env
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://dischargeflow:dischargeflow@postgres:5432/dischargeflow
      JWT_SECRET: local-dev-only-secret-change-me-0123456789
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dischargeflow-network

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      SEED_ON_STARTUP: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dischargeflow-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dischargeflow-network

volumes:
  postgres_data:

networks:
  dischargeflow-network:
    driver: bridge
