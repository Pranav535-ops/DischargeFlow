name: DischargeFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # Only the live-model eval step uses it; tests always run on the mock adapter.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dischargeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-otel.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-otel.txt ruff==0.17.1 pip-audit==2.10.1
    - name: Lint (ruff)
      run: ruff check .
    - name: Tests (SQLite)
      run: python -m pytest
    - name: Tests + migrations (PostgreSQL)
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dischargeflow_test
      run: python -m pytest
    # Golden-set evals of discharge-summary generation. Fails on any hallucinated medication or diagnosis, any
    # identifier sent to the model, or coverage below the threshold in app/ai/evals/golden_set.json.
    - name: AI evals (mock adapter)
      env:
        APP_ENV: test
      run: python -m app.ai.evals --provider mock
    # The same gate against a real, cheap model, on pull requests when the repository has an ANTHROPIC_API_KEY
    # secret (skipped otherwise, e.g. on forks).
    - name: AI evals (Claude Haiku 5.5)
      if: github.event_name == 'pull_request' && env.ANTHROPIC_API_KEY != ''
      env:
        APP_ENV: test
      run: python -m app.ai.evals --provider anthropic --model claude-haiku-5-5 --report ai-evals.json
    - name: Dependency audit (pip-audit)
      run: pip-audit -r requirements.txt -r requirements-otel.txt --progress-spinner off

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"
    - name: Install and Build
      env:
        CI: "true"
      run: |
        npm install
        npm run build --if-present
    - uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/build
        retention-days: 7
    # Report only. The shipped frontend is a static bundle, but react-scripts (CRA) is listed under
    # "dependencies", so even --omit=dev audits its whole build toolchain (webpack-dev-server, sockjs, ...), and
    # CRA is unmaintained, so those advisories cannot be fixed in place. This becomes a gate with the Vite
    # migration (ADR-001 Phase 5, item 17).
    - name: Dependency audit (npm, report only)
      run: npm audit --omit=dev || true

  container-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build API image
      run: docker build -t dischargeflow-api:ci ./backend
    # Fails on fixable critical vulnerabilities; reports high ones.
    - name: Trivy scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
          --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 0 dischargeflow-api:ci
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 image \
          --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 dischargeflow-api:ci

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: terraform fmt
      run: terraform fmt -check -recursive
    - name: terraform validate (staging, prod)
      run: |
        for env in staging prod; do
          (cd envs/$env && terraform init -backend=false -input=false && terraform validate)
        done
