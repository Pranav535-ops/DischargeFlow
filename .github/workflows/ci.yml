name: DischargeFlow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # Only the live-model eval step uses it; tests always run on the mock adapter.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dischargeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Tests (SQLite)
      run: python -m pytest
    - name: Tests + migrations (PostgreSQL)
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dischargeflow_test
      run: python -m pytest
    # Golden-set evals of discharge-summary generation. Fails on any hallucinated medication or diagnosis, any
    # identifier sent to the model, or coverage below the threshold in app/ai/evals/golden_set.json.
    - name: AI evals (mock adapter)
      env:
        APP_ENV: test
      run: python -m app.ai.evals --provider mock
    # The same gate against a real, cheap model, on pull requests when the repository has an ANTHROPIC_API_KEY
    # secret (skipped otherwise, e.g. on forks).
    - name: AI evals (Claude Haiku 5.5)
      if: github.event_name == 'pull_request' && env.ANTHROPIC_API_KEY != ''
      env:
        APP_ENV: test
      run: python -m app.ai.evals --provider anthropic --model claude-haiku-5-5 --report ai-evals.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: "18"
    - name: Install and Build
      working-directory: ./frontend
      run: |
        npm install
        npm run build --if-present
