# Self-hosted PostgreSQL for cluster deployments. In AWS, prefer RDS (ADR-001) and point DATABASE_URL at it instead.
# Create the credentials first:
#   kubectl -n dischargeflow-prod create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=dischargeflow --from-literal=POSTGRES_PASSWORD=<strong-password>
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dischargeflow-prod
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "dischargeflow"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: postgres-credentials
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d dischargeflow"]
          periodSeconds: 5
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dischargeflow-prod
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
