# Type-checking gate (ADR-001 Phase 6, item 23). Run from backend/: `mypy`.
# Covers the modules that type-check cleanly today. app.ai and app.chatbot are not included yet: they have
# pre-existing errors (mostly Optional handling around SDK responses) to fix before they join the gate.
[mypy]
python_version = 3.12
files = app/core, app/identity, app/patients, app/discharge, app/notifications, app/analytics, app/audit,
        app/insurance, app/interop, app/downtime, app/escalations, app/delivery, app/main.py, app/models.py, app/cli.py, app/seed.py
# Report errors only in the files above; imported modules outside the list are analysed but not reported.
follow_imports = silent
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
